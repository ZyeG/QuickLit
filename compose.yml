version: "1.0"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - appnet
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    depends_on:
      - qdrant
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    volumes:
      - ./backend/data:/app/data        # persist output JSONs
      - ./backend/.env.txt:/app/.env.txt  # pass env file
    ports:
      - "3001:3001"
    restart: unless-stopped
    networks:
      - appnet
  frontend:
    build:
      context: ./quicklit-web
      dockerfile: Dockerfile
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - appnet

volumes:
  qdrant_data:

networks:
  appnet:
    driver: bridge
